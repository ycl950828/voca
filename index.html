<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="토익단어">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1320" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>토익 단어 암기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: one-screen phone app. Study = header strip / question half / tap-to-reveal half / O·X / tab bar. Highlighter-on-vocab-book identity. */
:root{
  --paper:#F2F4F8; --card:#FFFFFF; --sunk:#E8ECF2; --ink:#17223A; --muted:#5D6A82; --line:#DCE1EA;
  --hl:#FFE14D; --hl-soft:rgba(255,225,77,.55); --primary:#17223A; --on-primary:#FFFFFF;
  --ok:#1E9A68; --no:#DD4A41; --word:#2D5FCC; --ex:#B0601A; --word-bg:rgba(45,95,204,.10); --ex-bg:rgba(176,96,26,.11);
  --shadow:0 1px 2px rgba(23,34,58,.06),0 8px 24px rgba(23,34,58,.07);
  --f-en:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1320; --card:#161F31; --sunk:#111929; --ink:#E8ECF4; --muted:#93A0B7; --line:#26324A;
  --hl:#E9CF45; --hl-soft:rgba(233,207,69,.42); --primary:#E9CF45; --on-primary:#1A1606;
  --ok:#35C189; --no:#FF6A61; --word:#82A8FF; --ex:#F0A25B; --word-bg:rgba(130,168,255,.14); --ex-bg:rgba(240,162,91,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1320; --card:#161F31; --sunk:#111929; --ink:#E8ECF4; --muted:#93A0B7; --line:#26324A;
  --hl:#E9CF45; --hl-soft:rgba(233,207,69,.42); --primary:#E9CF45; --on-primary:#1A1606;
  --ok:#35C189; --no:#FF6A61; --word:#82A8FF; --ex:#F0A25B; --word-bg:rgba(130,168,255,.14); --ex-bg:rgba(240,162,91,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--word);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 24px}

/* ---------- tab bar ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 8px 4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ico-bg{fill:var(--hl)}

/* ---------- study ---------- */
.study{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:8px 16px 12px}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;min-height:56px}
.count{justify-self:start;font-family:var(--f-num);font-weight:600;font-size:14px;background:var(--card);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{color:var(--muted);font-weight:500}
.acc{text-align:center;line-height:1.1}
.acc .lab{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.acc .val{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.acc .sub{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.acc .tagnew{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:3px 10px}
.hdr-right{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.speak{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.speak svg{width:20px;height:20px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.word{color:var(--word);background:var(--word-bg)}
.badge.example{color:var(--ex);background:var(--ex-bg)}
.badge.sec-LC{color:var(--word);background:var(--word-bg);font-size:13px;letter-spacing:.02em}
.badge.sec-RC{color:var(--ex);background:var(--ex-bg);font-size:13px;letter-spacing:.02em}
.secseg{grid-template-columns:1fr 1fr}
.secseg button{height:auto;padding:8px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.secseg button b{font-size:15px}
.secseg button small{font-size:11px;font-weight:500;color:var(--muted)}
.li .tag{font-size:11px;font-weight:700;margin-bottom:1px}
.li .tag.sec-LC{color:var(--word)} .li .tag.sec-RC{color:var(--ex)}
.claude-card .cc-head{display:flex;gap:12px;align-items:flex-start}
.claude-card .cc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--hl);color:#1A1606;flex:none}
.claude-card .cc-ic svg{width:22px;height:22px}
.btn span svg{width:18px;height:18px;display:block}
.adm{background:var(--sunk);border-radius:12px;padding:10px 12px}
.adm summary{font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.adm[open] summary{margin-bottom:8px}
.auth{display:flex;flex-direction:column;gap:14px;padding-top:28px}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:6px}
.brand-word{font-family:var(--f-en);font-weight:600;font-size:52px;line-height:1.1}
.brand-word .hl{background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 90%,transparent 90%)}
.brand h1{margin:0;font-size:20px}
.brand p{margin:0;color:var(--muted);font-size:13px;max-width:30ch}
.aform{display:flex;flex-direction:column;gap:12px}
.af{display:flex;flex-direction:column;gap:5px}
.af span{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
.ai{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:0 14px;font-size:16px;width:100%}
.ai:focus{outline:2px solid var(--word);outline-offset:0;background:var(--card)}
.aerr{margin:0;color:var(--no);font-size:13.5px;font-weight:600}
.alinks{display:flex;flex-direction:column;align-items:center;gap:10px}
.alinks .btn{width:100%}
.alink{color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px}
.reqbox{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sunk);border-radius:14px;padding:14px;text-align:center}
.reqbox>span{font-size:12px;color:var(--muted);font-weight:600}
.reqbox>b{font-family:var(--f-num);font-size:34px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.reqbox .timer{font-size:13px;color:var(--ink)}
.reqbox .timer b{font-family:var(--f-num);color:var(--no)}
.reqbox.expired>b{opacity:.35;text-decoration:line-through}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.phone b{font-family:var(--f-num)}
a.btn{text-decoration:none;color:var(--ink)}
.h1 .who{font-size:14px;font-weight:600;color:var(--muted);margin-left:8px}
.badge-row{display:flex;justify-content:flex-end;margin-top:-6px}

.qcard,.acard{flex:1 1 0;min-height:0;border-radius:var(--r);position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
.qcard{background:var(--card);box-shadow:var(--shadow);transition:box-shadow .2s, transform .25s}
.qcard.flash-ok{box-shadow:0 0 0 3px var(--ok),var(--shadow)}
.qcard.flash-no{box-shadow:0 0 0 3px var(--no),var(--shadow)}
.qcard.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.term-word{font-family:var(--f-en);font-weight:600;font-size:clamp(34px,11vw,54px);line-height:1.1;overflow-wrap:anywhere}
.term-ex{font-family:var(--f-en);font-weight:500;font-size:21px;line-height:1.45;text-wrap:pretty;overflow-wrap:anywhere}
.term-ex.long{font-size:18px}
.hl{background:linear-gradient(transparent 58%,var(--hl-soft) 58%,var(--hl-soft) 92%,transparent 92%);padding:0 .06em}
.term-word .hl{background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 90%,transparent 90%)}
.acard{background:var(--sunk);border:1.5px dashed var(--line);cursor:pointer;flex-direction:column;gap:10px;user-select:none;-webkit-user-select:none}
.acard.open{background:var(--card);border-style:solid;border-color:var(--line)}
.acard .hint{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px}
.acard .hint svg{width:30px;height:30px}
.meaning{font-size:23px;font-weight:600;line-height:1.45;text-wrap:pretty;overflow-wrap:anywhere}
.meaning.ex{font-size:17px;font-weight:500}
.ref{font-size:12px;color:var(--muted)}
.ref b{font-family:var(--f-en);font-size:15px;color:var(--ink);font-weight:600}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oxb{height:64px;border-radius:16px;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.oxb:active{transform:scale(.96)}
.oxb .big{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1}
.oxb .sm{font-size:13px;font-weight:600;opacity:.9}
.oxb.o{background:var(--ok)} .oxb.x{background:var(--no)}
:root[data-theme="dark"] .oxb,.oxb{color:#fff}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px 16px}
.empty h2{margin:0;font-size:20px;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.mock{width:100%;max-width:300px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 16px;font-family:var(--f-en);font-size:32px;font-weight:600}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-weight:700;font-size:15px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:var(--no);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}
.h1{font-size:28px;font-weight:700;margin:6px 0 12px;letter-spacing:-.01em}
.section{margin-top:18px}
.section>h3{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px 4px;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.note{font-size:12.5px;color:var(--muted);margin:8px 4px 0}

/* ---------- register ---------- */
.sources{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.src{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;cursor:pointer}
.src .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--primary);color:var(--on-primary)}
.src .ic svg{width:28px;height:28px}
.src b{font-size:15px}
.src span{font-size:12px;color:var(--muted);line-height:1.35;white-space:pre-line}
.src .rec{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;background:var(--hl);color:#1A1606;border-radius:6px;padding:2px 6px}
.src input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
details.tip{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
details.tip summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"＋";color:var(--muted)}
details.tip[open] summary::after{content:"－"}
.steps{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps b{background:var(--hl-soft);padding:0 3px;border-radius:3px}

.cropwrap{position:relative;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;border-radius:12px;background:#000}
.cropwrap canvas{display:block;width:100%;height:auto}
.cropbox{position:absolute;border:2px solid var(--hl);box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.handle{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--hl);border:3px solid #fff;touch-action:none}
.croptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-left:auto}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.prog{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--primary);width:0;transition:width .25s}
.status{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

textarea.raw{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:12px;font-size:14px;line-height:1.5}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.entry{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.entry:last-child{border-bottom:0}
.entry.off{opacity:.5}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px}
.chk svg{width:16px;height:16px;opacity:0}
.entry:not(.off) .chk{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.entry:not(.off) .chk svg{opacity:1}
.entry .fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld{width:100%;border:0;border-bottom:1px dashed transparent;background:none;padding:2px 0;resize:none;overflow:hidden;line-height:1.4;display:block}
.fld:focus{outline:none;border-bottom-color:var(--line)}
.fld.term{font-family:var(--f-en);font-size:18px;font-weight:600}
.fld.term.ex{font-size:15.5px;font-weight:500}
.fld.mean{font-size:14px;color:var(--muted)}
.fld.mean.missing::placeholder{color:var(--no)}
.del{width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.del svg{width:18px;height:18px}
.savebar{padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
.savebar .btn{width:100%}

/* ---------- list ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 4px}
.stat{text-align:center;border-right:1px solid var(--line);padding:0 4px;min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;color:var(--muted)}
.search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:15px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.li{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:12px 14px 12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:center}
.li:last-child{border-bottom:0}
.li .bar{align-self:stretch;border-radius:0 3px 3px 0}
.li .bar.word{background:var(--word)} .li .bar.example{background:var(--ex)}
.li .t{font-family:var(--f-en);font-weight:600;font-size:17px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .t.ex{font-size:14.5px;font-weight:500}
.li .m{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .r{text-align:right;font-family:var(--f-num);font-size:13px;font-weight:600;white-space:nowrap}
.li .r small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.more{display:block;width:100%;padding:14px;text-align:center;font-weight:600;color:var(--word)}
.topbar{display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:22px;height:22px}

/* ---------- sheet & toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,15,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:18px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.seg button{height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.form-l{font-size:12px;font-weight:700;color:var(--muted);margin:14px 4px 6px}
.input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font-size:15px;resize:vertical}
.input.en{font-family:var(--f-en);font-size:17px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.kv div{background:var(--card);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}
.kv b{display:block;font-family:var(--f-num);font-size:17px}
.kv span{font-size:11px;color:var(--muted)}
.menu{display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.menu button{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.menu button:last-child{border-bottom:0}
.menu button svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu button.warn{color:var(--no)} .menu button.warn svg{color:var(--no)}
.menu button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:up .2s}
.toast button{color:var(--hl);font-weight:700;white-space:nowrap;flex:none}
.warnbar{margin:8px 16px 0;padding:8px 12px;border-radius:10px;background:var(--ex-bg);color:var(--ex);font-size:12.5px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.term-word{font-size:34px}.meaning{font-size:19px}.oxb{height:54px}.hdr{min-height:48px}}

<script src="tesseract.min.js"></script>
<script>
// ===== 단어장 텍스트 파서 (OCR 결과 / 아이폰 텍스트 인식 붙여넣기 공용) =====
const VocabParser = (() => {
  const isHangul = (c) => {
    const n = c.codePointAt(0);
    return (n >= 0xac00 && n <= 0xd7a3) || (n >= 0x3131 && n <= 0x318e);
  };
  const hangulCount = (s) => { let k = 0; for (const c of s) if (isHangul(c)) k++; return k; };
  const latinCount = (s) => (s.match(/[A-Za-z]/g) || []).length;
  const hasHangul = (s) => hangulCount(s) > 0;
  const hasLatin = (s) => /[A-Za-z]/.test(s);
  const tidy = (s) => s.replace(/\s+/g, ' ').trim();

  // 번호: "11." "11," "11 ." "(11)" "11)" — OCR 오인식 "I1." "l1." 도 허용
  const ENTRY_RE = /^[\(\[]?\s*[Il|]?(\d{1,4})\s*[.,)\]]\s*(?=[A-Za-z~(\[])/;
  const POS_RE = /\b(n|v|vt|vi|adj|adv|a|ad|prep|conj|pron|phr|int)\.(?=\s|$)/gi;

  // OCR 자잘한 오류 정리
  function normalize(raw) {
    let s = String(raw || '')
      .replace(/[  -​　]/g, ' ')
      .replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"')
      .replace(/ﬁ/g, 'fi').replace(/ﬂ/g, 'fl')
      .replace(/[—–]/g, '-');
    s = s.trim();
    // 점선 테두리가 글자로 읽힌 것 (줄 앞/뒤의 | ¦ ! : 등)
    s = s.replace(/^[|¦!:;_\-]+\s*/, '').replace(/^=+(?!\s*[A-Za-z])\s*/, '').replace(/\s*[|¦!_=]+$/, '');  // "= PR" 동의어 표기는 유지
    // 숙어 표시 ">" 의 다양한 오인식 통일
    s = s.replace(/^[›»＞→▶▸]\s*/, '> ');
    // "| 11." 처럼 테두리 뒤 번호 / 테두리가 l, I 로 읽힌 경우
    s = s.replace(/^[lI1|]\s+(?=\d{1,4}\s*[.,)])/, '');
    // 손글씨 표시 등으로 번호 앞에 붙은 기호 "/17." "^17."
    s = s.replace(/^[^\w가-힣(\[~"']+(?=\d{1,4}\s*[.,)])/, '');
    // 홀로 떨어진 자모·가운뎃점 (테두리/얼룩 오인식)
    s = s.replace(/(^|\s)[\u3131-\u318e·ㆍ]+(?=\s|$)/g, '$1').trim();
    // 테두리가 i, l 로 읽혀 한글 앞에 붙은 경우
    s = s.replace(/^[Il|]['`]\s+/, '');
    s = s.replace(/^[iIl|]\s+(?=[가-힣])/, '').replace(/\s+[iIl|]$/, '');
    // 영어 문장 끝 뒤에 붙은 짧은 잡음 "authority.:" "skill. )" "form. 나 5"
    if (latinCount(s) > hangulCount(s)) s = s.replace(/([.?!])(?:\s*[^\sA-Za-z0-9]{1,3}|\s+\S{1,2}){1,3}$/, '$1');
    // 글머리 기호
    s = s.replace(/^[□☐☑■●○◦•▪▫◇◆☆★✓✔*·]+\s*/, '');
    // 문장부호 앞 공백 정리
    s = s.replace(/\s+([,.;:?!)])/g, '$1').replace(/\(\s+/g, '(');
    // 한글이 한 글자씩 띄어져 인식된 경우 붙이기 (예: "전 자 장 비 의")
    s = s.replace(/(?:[가-힣] ){3,}[가-힣](?![가-힣])/g, (m) => m.replace(/ /g, ''));
    return tidy(s);
  }

  function isNoise(s) {
    if (s.length < 2) return true;
    if (!hasLatin(s) && !hasHangul(s)) return true;               // "-44-" 같은 쪽 번호
    if (/^(day|unit|chapter|lesson|part|week|test|review)\s*\d+$/i.test(s)) return true;
    if (/vocab/i.test(s) && s.length < 40 && hangulCount(s) <= 6 && !ENTRY_RE.test(s)) return true; // 머리글
    return false;
  }

  const endsSentence = (s) => /[.?!"']$/.test(s.trim());
  function isSentence(s) {
    const words = s.split(' ').filter((w) => /[A-Za-z]/.test(w));
    return words.length >= 4 || (words.length >= 3 && endsSentence(s));
  }

  // 한국어 줄인가? (영어 고유명사가 섞여 있어도 한글이 주도하면 한국어)
  function isKoreanLine(s) {
    const h = hangulCount(s), l = latinCount(s);
    if (h === 0) return false;
    if (h >= 2) return h >= l * 0.3;   // "Star Airways사는 …" 은 한국어, "수르 fastest way …" 는 영어
    return l < 3;
  }

  function stripForProbe(s) {
    return tidy(s.replace(/\[[^\]]*\]/g, ' ').replace(/\/[^/]{1,40}\//g, ' ').replace(POS_RE, ' '));
  }

  // "abandon [əbǽndən] v." → { term: "abandon", pos: "v." }
  function cleanWord(s) {
    let t = s.replace(/\[[^\]]*\]/g, ' ').replace(/\/[^/]{1,40}\//g, ' ');
    let pos = null;
    const m = t.match(/\b(n|v|vt|vi|adj|adv|a|ad|prep|conj|pron|phr|int)\.(?=\s|$)/i);
    if (m) { pos = m[0].toLowerCase(); t = t.replace(m[0], ' '); }
    // 표제어 뒤 잡음: "exempt 8)" (형)의 오인식) 같은 숫자/짧은 괄호 조각
    let lost = null;
    t = t.replace(/\s+(\S{1,2}\))\s*$/, (m, g) => { lost = g; return ''; });
    if (lost && /^[8B]\)$/.test(lost)) pos = pos || '형)';
    t = t.replace(/^[^A-Za-z~]+/, '').replace(/[^A-Za-z~)]+$/, '');
    return { term: tidy(t), pos };
  }

  // 첫 한글 위치에서 영어/한국어 분리. "(~에)" 같은 앞쪽 괄호는 뜻 쪽으로
  function splitEnKo(line) {
    const chars = [...line];
    let cut = chars.findIndex(isHangul);
    if (cut < 0) return null;
    const carry = new Set(['(', '[', '{', '~', '<', '（', '【', '「']);
    while (cut > 0 && (carry.has(chars[cut - 1]) || (chars[cut - 1] === ' ' && cut > 1 && carry.has(chars[cut - 2])))) cut--;
    // 품사 약어 "형)" "명)" "동)" 는 이미 한글이므로 그대로 뜻에 포함됨
    const en = chars.slice(0, cut).join('').trim();
    const ko = chars.slice(cut).join('').trim();
    if (!hasLatin(en)) return null;
    return { en, ko };
  }

  function joinEnglish(a, b) {
    if (!a) return b;
    if (/[A-Za-z]-$/.test(a) && /^[a-z]/.test(b)) return a.slice(0, -1) + b; // 줄 끝 하이픈
    return a + ' ' + b;
  }

  function makeWord(en, ko) {
    const { term, pos } = cleanWord(en);
    let meaning = tidy(ko || '');
    if (pos && meaning) meaning = pos + ' ' + meaning;
    return { term, meaning, kind: 'word', include: !!(term && meaning) };
  }
  function makeExample(en, ko, ref) {
    // 문장 끝 뒤에 붙은 짧은 잡음 제거 ("downtown. TE")
    const term = tidy(en).replace(/([.?!])(?:\s*[^\sA-Za-z0-9]{1,3}|\s+\S{1,2}){1,3}$/, '$1');
    const meaning = tidy(ko || '');
    return { term, meaning, kind: 'example', ref: ref || '', include: !!(term && meaning) };
  }

  // ---------- 번호가 매겨진 단어장 (R/C: "11. steadily 꾸준히", L/C 표: "1 merchandise (명) 상품") ----------
  const ENTRY_RE2 = /^[\(\[]?\s*[Il|]?(\d{1,3})\s+(?=[A-Za-z~])/;       // 번호 뒤 점 없는 형식
  const PHRASE_MARK = /^>\s*/;                                            // "> promotional merchandise"
  const POS_KO = /^[\(\[]?\s*(명|동|형|부|전|접|대|감)\s*[\)\]]/;           // "(명) 상품" 품사 표시
  const SYN_RE = /^[=≒≈]\s*[A-Za-z]/;                                     // "= PR"
  const koreanLed = (l) => /^[(\[]?\s*[가-힣]/.test(l) || /[A-Za-z]{2,}[가-힣]/.test(l);
  function stripHead(l) { return ENTRY_RE.test(l) ? l.replace(ENTRY_RE, '') : l.replace(ENTRY_RE2, ''); }
  function hasNumber(l) { return ENTRY_RE.test(l) || ENTRY_RE2.test(l); }
  function isHeadLine(l) {
    if (PHRASE_MARK.test(l)) return false;
    if (ENTRY_RE.test(l)) return true;
    const m = l.match(ENTRY_RE2);
    const body = m ? l.slice(m[0].length) : l;
    const sp = hasHangul(body) ? splitEnKo(body) : null;
    const en = sp ? sp.en : body;
    if (!hasLatin(en) || isSentence(stripForProbe(en))) return false;
    if (m) return true;
    // OCR이 번호를 놓쳐도 "(명)" 같은 품사로 시작하는 뜻이 붙어 있으면 표제어로 봄
    return !!(sp && POS_KO.test(sp.ko) && latinCount(en) >= 2 && !koreanLed(body));
  }

  function parseNumbered(lines) {
    const out = [];
    const blocks = [];
    let block = null;
    for (const l of lines) {
      if (isHeadLine(l)) { block = { head: stripHead(l), rest: [] }; blocks.push(block); }
      else if (block) block.rest.push(l);
    }
    for (const b of blocks) {
      const sp = hasHangul(b.head) ? splitEnKo(b.head) : null;
      const head = makeWord(sp ? sp.en : b.head, sp ? sp.ko : '');
      if (!head.term) continue;
      out.push(head);
      let pend = null;      // 뜻을 기다리는 영어 { en, phrase }
      let last = head;      // 줄바꿈된 뜻/해석을 이어붙일 대상
      let orphan = null;    // 표에서 예문보다 위에 걸쳐 있는 해석 첫 줄
      const finish = (ko) => {
        if (!pend) return;
        if (!pend.phrase && orphan) { ko = tidy(orphan + ' ' + ko); orphan = null; }
        const it = pend.phrase ? makeWord(pend.en, ko) : makeExample(pend.en, ko, head.term);
        if (it.term) { out.push(it); last = it; }
        pend = null;
      };
      const addKo = (l) => {
        if (pend) return finish(l);
        // 짧은 뜻(단어·숙어) 뒤에 오는 긴 한국어 줄 = 다음 예문 해석의 첫 줄
        if (last.kind === 'word' && last.meaning && hangulCount(l) >= 10 && !/[.!?]$/.test(l)) { orphan = orphan ? orphan + ' ' + l : l; return; }
        if (!last.meaning) last.meaning = tidy(l);
        else if (!/[.!?]$/.test(last.meaning)) last.meaning = tidy(last.meaning + ' ' + l);  // 끝나지 않은 뜻만 이어붙임 (분류 제목 등은 무시)
        last.include = !!(last.term && last.meaning);
      };
      for (const raw of b.rest) {
        let l = raw, mark = false;
        if (PHRASE_MARK.test(l)) { l = l.replace(PHRASE_MARK, ''); mark = true; }
        if (!l) continue;
        if (SYN_RE.test(l)) {
          const syn = l.replace(/[가-힣(].*$/, '').trim();
          head.meaning = tidy(head.meaning + ' (' + syn + ')');
          head.include = !!(head.term && head.meaning);
          continue;
        }
        const K = hasHangul(l), E = hasLatin(l);
        const pendSent = !!pend && !pend.phrase;
        // 표에서 한 줄로 합쳐진 "…문장 끝부분. 해석" (앞 줄 예문의 이어짐 + 해석)
        if (K && E && pendSent && !mark && !endsSentence(pend.en) && !koreanLed(l)) {
          const s2 = splitEnKo(l);
          if (s2 && /[.?!]["']?$/.test(s2.en)) { pend.en = joinEnglish(pend.en, s2.en); finish(s2.ko); continue; }
        }
        if (K && (!E || (pendSent && !mark) || koreanLed(l))) { addKo(l); continue; }
        if (K && E) {
          const s2 = splitEnKo(l);
          if (s2) {
            if (pend) finish('');
            pend = { en: s2.en, phrase: mark || !isSentence(stripForProbe(s2.en)) };
            finish(s2.ko);
          } else addKo(l);
          continue;
        }
        // 영어만 있는 줄
        if (pend && !pend.phrase && !mark && !endsSentence(pend.en)) { pend.en = joinEnglish(pend.en, l); continue; }
        if (pend) finish('');
        pend = { en: l, phrase: mark || !isSentence(stripForProbe(l)) };
      }
      finish('');
      if (orphan) { last.meaning = tidy(last.meaning + ' ' + orphan); last.include = !!(last.term && last.meaning); }
    }
    return out;
  }

  // ---------- 영어 칸 / 한국어 칸이 따로 읽힌 표 (아이폰 텍스트 인식 등) ----------
  // 영어 줄들과 한국어 줄들을 각각 순서대로 모은 뒤 하나씩 짝지음
  function parseSeparated(enLines, koLines) {
    const items = [];
    for (const raw of enLines) {
      let l = raw, mark = false;
      if (PHRASE_MARK.test(l)) { l = l.replace(PHRASE_MARK, ''); mark = true; }
      if (!l || !hasLatin(l)) continue;
      const prev = items[items.length - 1];
      if (SYN_RE.test(l)) { items.push({ type: 'syn', en: l }); continue; }
      if (!mark && hasNumber(l) && !isSentence(stripForProbe(stripHead(l)))) { items.push({ type: 'head', en: stripHead(l) }); continue; }
      if (prev && prev.type === 'sentence' && !mark && !endsSentence(prev.en)) { prev.en = joinEnglish(prev.en, l); continue; }
      items.push({ type: mark || !isSentence(stripForProbe(l)) ? 'phrase' : 'sentence', en: l });
    }
    const ko = koLines.filter((l) => hasHangul(l));
    let k = 0;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.type === 'syn') continue;
      if (k >= ko.length) { it.ko = ''; continue; }
      if (it.type === 'sentence') {
        let s = ko[k++];
        while (k < ko.length && !/[.!?]$/.test(s) && !POS_KO.test(ko[k])) s += ' ' + ko[k++];
        it.ko = s;
      } else if (it.type === 'head' && !POS_KO.test(ko[k]) && k + 1 < ko.length && POS_KO.test(ko[k + 1])) {
        k++; it.ko = ko[k++];               // 품사 표시로 다시 맞추기 (한 줄 밀린 경우)
      } else it.ko = ko[k++];
    }
    const out = [];
    let head = null;
    for (const it of items) {
      if (it.type === 'syn') { if (head) { head.meaning = tidy(head.meaning + ' (' + it.en.replace(/[가-힣(].*$/, '').trim() + ')'); head.include = !!(head.term && head.meaning); } continue; }
      if (it.type === 'sentence') out.push(makeExample(it.en, it.ko, head ? head.term : ''));
      else { const w = makeWord(it.en, it.ko); if (it.type === 'head') head = w; if (w.term) out.push(w); }
    }
    return out;
  }

  // 페이지 머리글로 L/C·R/C 판별
  function detectSection(text) {
    const t = String(text || '');
    if (/R\s*[\/|]?\s*C\s*Vocab/i.test(t)) return 'RC';
    if (/L\s*[\/|]?\s*C\s*\d{1,2}\s*일\s*차/i.test(t) || /L\s*[\/|]?\s*C\s*Vocab/i.test(t)) return 'LC';
    if (/R\s*[\/|]?\s*C\s*\d{1,2}\s*일\s*차/i.test(t)) return 'RC';
    // 머리글이 안 읽힌 경우 구조로 판단: "> 숙어"·"(명)" 표시가 여러 번 → L/C 표, "11. word" 번호 형식 → R/C
    const lines = t.split(/\r?\n/).map((x) => x.trim());
    const lcMarks = lines.filter((x) => /^[>›»]\s*[A-Za-z]/.test(x) || /\((명|동|형|부)\)/.test(x)).length;
    const rcMarks = lines.filter((x) => /^\d{1,3}\.\s*[A-Za-z]/.test(x)).length;
    if (lcMarks >= 3 && lcMarks > rcMarks) return 'LC';
    if (rcMarks >= 3 && lcMarks === 0) return 'RC';
    return null;
  }

  // ---------- 번호 없는 일반 단어장 ----------
  function parseGeneric(lines) {
    const out = [];
    let pending = null;     // 뜻을 기다리는 영어
    let lastIdx = -1;
    let lastWord = '';
    const pushEn = (en, ko) => {
      const probe = stripForProbe(en);
      if (isSentence(probe)) out.push(makeExample(en, ko, lastWord));
      else { const w = makeWord(en, ko); out.push(w); lastWord = w.term; }
      lastIdx = out.length - 1;
    };
    const flushPending = () => { if (pending) pushEn(pending, ''); pending = null; };

    for (const l of lines) {
      const K = hasHangul(l);
      let E = hasLatin(l);
      if (E && K) {
        const pendingIsSentence = pending && isSentence(pending);
        if (pendingIsSentence || /[A-Za-z0-9&]+[가-힣]/.test(l) || (hangulCount(l) >= 12 && hangulCount(l) > latinCount(l) * 2)) E = false;
      }
      const sp = E && K ? splitEnKo(l) : null;
      if (sp) {
        flushPending();
        pushEn(sp.en, sp.ko);
      } else if (E && !K) {
        if (pending && isSentence(pending) && !endsSentence(pending)) pending = joinEnglish(pending, l);
        else { flushPending(); pending = l; }
        lastIdx = -1;
      } else if (K) {
        if (pending) { pushEn(pending, l); pending = null; }
        else if (lastIdx >= 0) {
          const e = out[lastIdx];
          e.meaning = tidy(e.meaning + ' ' + l);
          e.include = !!(e.term && e.meaning);
        }
      }
    }
    flushPending();
    return out.filter((e) => e.term);
  }

  const toLines = (text) => (Array.isArray(text) ? text : String(text).split(/\r?\n/))
    .map(normalize).filter((l) => l && !isNoise(l));

/* ================= 출제 로직 ================= */
function pickNext() {
  const items = S.items;
  if (!items.length) { S.current = null; return; }
  let pool = items;
  if (items.length > 1 && S.current) pool = items.filter((i) => i.id !== S.current.id);
  const total = pool.reduce((a, i) => a + Math.max(i.weight, 1e-4), 0);
  let r = Math.random() * total;
  for (const it of pool) { r -= Math.max(it.weight, 1e-4); if (r < 0) { S.current = it; return; } }
  S.current = pool[pool.length - 1];
}
async function answer(ok) {
  const it = S.current; if (!it) return;
  S.last = { id: it.id, prev: { weight: it.weight, attempts: it.attempts, correct: it.correct, lastSeen: it.lastSeen } };
  it.attempts += 1; it.lastSeen = Date.now();
  if (ok) { it.correct += 1; it.weight = Math.max(it.weight * 0.5, 1e-4); }  // O → 재등장 빈도 ½, X → 유지
  Store.put(it).catch(() => showWarn('기록을 저장하지 못했어요.'));
  const card = document.querySelector('.qcard');
  if (card) card.classList.add(ok ? 'flash-ok' : 'flash-no');
  setTimeout(() => {
    S.revealed = false; pickNext(); render(true);
    toast(ok ? 'O 기록됨' : 'X 기록됨', { label: '되돌리기', fn: undo });
  }, 170);
}
function undo() {
  if (!S.last) return;
  const it = S.items.find((i) => i.id === S.last.id); if (!it) return;
  Object.assign(it, S.last.prev); Store.put(it);
  S.current = it; S.revealed = false; S.last = null; render(true);
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find((x) => x.lang === 'en-US'); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { toast('이 화면에서는 발음 재생이 지원되지 않아요'); }
}

// ---------- 예문 형광펜: 영어 문장의 표제어/숙어 ↔ 한글 해석의 해당 뜻 ----------
const escRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// 단어 뜻 "(명) 상품, 제품" → ["상품", "제품"]
function koCandidates(meaning) {
  const m = (meaning || '')
    .replace(/\[[^\]]*\]/g, ' ').replace(/\(\s*=[^)]*\)/g, ' ').replace(/[≠=][^,;/]*/g, ' ')
    .replace(/\(?\s*(명|동|형|부|전|접|대)\s*\)\s*/g, ' ')
    .replace(/\b(n|v|vt|vi|adj|adv|a|ad|prep|conj|pron|phr)\.\s*/gi, ' ')
    .replace(/\([가-힣\s~]*\)/g, ' ').replace(/[()~]/g, ' ');
  return m.split(/[,;/·]+/).map((x) => x.replace(/[^가-힣\s]/g, '').replace(/\s+/g, ' ').trim()).filter((x) => x.replace(/ /g, '').length >= 2);
}
// 어미를 뗀 줄기 + (3글자 이상이면) 앞·뒤 두 글자
function koStems(c) {
  const out = [];
  const st = c.replace(/(시키다|하다|되다|하는|되는|적인|이다|한|된|적|의|히|다)$/, '').trim();
  if (st !== c && st.replace(/ /g, '').length >= 2) out.push({ t: st, extend: true });       // 활용 어미까지 표시
  const core = st.replace(/ /g, '');
  if (core.length >= 3) out.push({ t: core.slice(0, 2), extend: false }, { t: core.slice(-2), extend: false });   // 조사는 빼고 표시
  return out;
}
function findKo(trans, cands) {
  for (const c of cands) { const i = trans.indexOf(c); if (i >= 0) return [i, i + c.length]; }       // 뜻 그대로
  for (const c of cands) for (const st of koStems(c)) {                                               // 활용형 (면제하다 → 면제됩니다)
    const i = trans.indexOf(st.t);
    if (i >= 0) { let e = i + st.t.length; if (st.extend) while (e < trans.length && /[가-힣]/.test(trans[e])) e++; return [i, e]; }
  }
  return null;
}
function exampleHighlight(it) {
  const sent = it.term, low = sent.toLowerCase(), sec = secOf(it);
  const words = S.items.filter((w) => w.kind === 'word' && secOf(w) === sec);
  const base = (w) => w.term.replace(/\([^)]*\)/g, '').replace(/~/g, '').trim().toLowerCase();
  let cands = words.filter((w) => base(w).length >= 3 && new RegExp('\\b' + escRe(base(w))).test(low));
  const head = it.ref ? words.find((w) => w.term.toLowerCase() === it.ref.toLowerCase()) : null;
  if (head && !cands.includes(head)) cands.push(head);
  cands.sort((a, b) => base(b).length - base(a).length);   // 긴 숙어부터 (promotional merchandise > merchandise)
  const enRange = (w) => {
    const b = base(w);
    let m = new RegExp('\\b' + escRe(b) + '[a-z]*', 'i').exec(sent);
    if (!m && b.length > 4 && !b.includes(' ')) m = new RegExp('\\b' + escRe(b.slice(0, Math.max(4, b.length - 2))) + '[a-z]*', 'i').exec(sent);
    return m ? [m.index, m.index + m[0].length] : null;
  };
  let en = null, ko = null;
  for (const w of cands) {
    const e = enRange(w), k = findKo(it.meaning, koCandidates(w.meaning));
    if (e && k) return { en: e, ko: k };
    if (!en && e) en = e;
    if (!ko && k) ko = k;
  }
  if (!en && it.ref) en = enRange({ term: it.ref });
  return { en, ko };
}
function markRange(text, range) {
  const frag = document.createDocumentFragment();
  if (!range) { frag.append(text); return frag; }
  frag.append(text.slice(0, range[0]), h('span', { class: 'hl' }, text.slice(range[0], range[1])), text.slice(range[1]));
  return frag;
}

      if (run >= vmin) for (let yy = y - run; yy < y; yy++) { wipe(x, yy); if (x > 0) wipe(x - 1, yy); if (x < W - 1) wipe(x + 1, yy); }
      run = 0;
    }
  }
  for (let y = 0; y < H; y++) {
    let run = 0;
    for (let x = 0; x <= W; x++) {
      if (x < W && dark(x, y)) { run++; continue; }
      if (run >= hmin) for (let xx = x - run; xx < x; xx++) { wipe(xx, y); if (y > 0) wipe(xx, y - 1); if (y < H - 1) wipe(xx, y + 1); }

}
function claudePrompt(section, parts) {

    : ' 사진이 여러 장이면 각 장을 차례대로 모두 옮기세요.';
  return `첨부한 사진은 토익 단어장 페이지입니다.${pieces}
페이지에 인쇄된 학습 내용을 빠짐없이, 인쇄된 그대로 옮겨서 JSON 배열 하나로만 답하세요. 다른 설명은 쓰지 마세요.

[형식 구분 - sec]
- "RC": 위쪽에 "R/C Vocab"이 있거나, "11. steadily 꾸준히"처럼 번호·단어·뜻이 한 줄에 있고 그 아래 영어 예문과 한국어 해석이 이어지는 형식
- "LC": 왼쪽 칸에 영어(번호 단어, "> 숙어", 예문), 오른쪽 칸에 한국어(뜻, 해석)가 있는 표 형식. 같은 높이의 왼쪽 칸과 오른쪽 칸이 짝입니다.
- 사용자가 고른 형식은 ${hint}입니다. 페이지가 분명히 다른 형식이면 페이지를 따르세요.

[항목 - type]
- "word": 번호가 붙은 표제어. en은 번호 없이 단어만, ko는 뜻 전체 (품사 표시 "(명)", "형)" 등은 인쇄된 그대로)
- "phrase": "> "로 시작하는 숙어·파생어. en은 ">" 없이, ko는 그 뜻
- "example": 예문. 여러 줄에 걸친 영어 문장은 한 문장으로 합치고, ko도 해석 전체를 한 줄로 합치세요 (" / " 같은 구분 기호는 그대로). head에는 이 예문이 속한 표제어
- "= PR" 같은 동의어 줄은 따로 만들지 말고 표제어 ko 끝에 " (= PR)"처럼 붙이세요.
- 제외: 페이지 제목·머리글, QR·영상 안내, 사진·그림 속 글자, 워터마크, 쪽 번호, 맨 아래 명언
- 손글씨 표시는 무시하고 인쇄된 글자만 읽으세요.

[예시]
[{"sec":"RC","type":"word","en":"allocate","ko":"할당하다, 배분하다"},
 {"sec":"RC","type":"example","en":"The manager allocated additional funds to the marketing department.","ko":"매니저는 마케팅 부서에 추가 자금을 할당했다.","head":"allocate"},

}
// 사진을 위→아래 조각으로 나눔 (Claude에 보내는 사진은 작게 줄어들기 때문에, 조각마다 글자가 크게 보이도록)
async function makeStrips(C) {
  const [rw, rh] = rotatedSize(C.img, C.rot);
  const cw = C.crop.w * rw, ch = C.crop.h * rh;
  let s = Math.min(1, 3000 / cw);
  if (rw * rh * s * s > 24e6) s = Math.sqrt(24e6 / (rw * rh));
  const full = drawRotated(C.img, C.rot, s);
  const W = Math.round(cw * s), H = Math.round(ch * s), X = Math.round(C.crop.x * rw * s), Y = Math.round(C.crop.y * rh * s);
  const n = Math.max(1, Math.min(CL.max, Math.ceil(H / (W * 0.62))));
  const ov = n > 1 ? Math.round(H * 0.05) : 0;
  const step = (H - ov) / n;
  const blobs = [];
  for (let i = 0; i < n; i++) {
    const y0 = Math.round(i * step), hh = Math.round(Math.min(H - y0, step + ov));
    const c = document.createElement('canvas'); c.width = W; c.height = hh;
    c.getContext('2d').drawImage(full, X, Y + y0, W, hh, 0, 0, W, hh);
    blobs.push(await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.9)));
  }
  full.width = full.height = 0;
  return blobs;
}
const CLAUDE_ERR = {

  sampling_disabled: '이 계정에서는 Claude 연동을 쓸 수 없어요.',
  images_unavailable: '이 화면에서는 사진을 Claude에 보낼 수 없어요.',
  rate_limited: 'Claude 사용량이 많아요. 잠시 뒤 다시 시도해 주세요.',
  session_expired: 'Claude에 다시 로그인한 뒤 시도해 주세요.',
  image_rejected: '이 사진은 보낼 수 없어요. 다른 사진으로 시도해 주세요.',
  invalid_json: '결과를 읽지 못했어요. 한 번 더 시도해 주세요.',
  refused: 'Claude가 이 사진을 처리하지 않았어요.',

async function runClaude() {
  const R = S.reg, C = R.cur; if (!C || !CL.sample) return;
  R.busy = true; R.claude = true; R.progress = 0.05; R.status = 'Claude에 보낼 사진 준비 중…'; render();
  const setStatus = (t, p) => { R.status = t; if (p != null) R.progress = p; const st = document.querySelector('.status'); if (st) st.lastChild.textContent = t; const bar = document.querySelector('.prog i'); if (bar) bar.style.width = Math.round(R.progress * 100) + '%'; };
  let timer = null;
  try {
    const blobs = await makeStrips(C);
    const ctl = new AbortController(); CL.ctl = ctl;
    const t0 = Date.now(); let got = 0;
    timer = setInterval(() => { const sec = Math.round((Date.now() - t0) / 1000); setStatus(got ? `Claude가 정리하는 중… ${got}개 항목 (${sec}초)` : `Claude가 사진을 읽는 중… ${sec}초`, Math.min(0.95, 0.1 + sec / 90)); }, 1000);
    const data = await CL.sample.json(claudePrompt(R.section, blobs.length), {
      images: blobs, signal: ctl.signal, modelTier: 'default',
      onText: ({ text }) => { got = (text.match(/"en"\s*:/g) || []).length; },
    });
    const found = VocabParser.parseJSON(JSON.stringify(data)) || [];
    const sec = majoritySection(found); if (sec) setSection(sec, sec !== R.section);
    R.entries = R.entries.concat(found.map((e) => fixEntry({ ...e, section: e.section || R.section })));
    toast(found.length ? `Claude가 ${found.length}개를 읽었어요. 저장 전에 확인해 주세요.` : '읽은 항목이 없어요. 영역을 다시 맞춰 주세요.');
    R.done = (R.done || 0) + 1;
    R.busy = false; R.claude = false;
    clearInterval(timer);
    await nextFile();
  } catch (e) {
    clearInterval(timer);
    R.busy = false; R.claude = false; render();
    const code = e && e.code;
    if (code === 'cancelled') return;
    if (['not_granted', 'sampling_disabled', 'images_unavailable', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { CL.sample = null; render(); }
    toast(CLAUDE_ERR[code] || 'Claude 연결에 문제가 생겼어요. 잠시 뒤 다시 시도해 주세요.');
  }
}

  const search = h('input', { class: 'search', type: 'search', id: 'listSearch', placeholder: '단어 또는 뜻 검색', value: L.q, oninput: (e) => { L.q = e.target.value; L.limit = 80; refreshList(); } });
  wrap.append(h('div', { class: 'section' }, search,
    h('div', { class: 'chips' }, [['all', '전체'], ['LC', 'L/C'], ['RC', 'R/C'], ['word', '단어'], ['example', '예문'], ['weak', '취약 60%↓']].map(([k, lab]) =>
      h('button', { class: 'chip', 'aria-pressed': String(L.filter === k), onclick: () => { L.filter = k; L.limit = 80; render(); } }, lab)))));
  const listEl = h('div', { class: 'list', id: 'listBox' });
  fillList(listEl, rows);

  if (!rows.length) wrap.append(h('p', { class: 'note', style: 'text-align:center;margin-top:16px' }, items.length ? '조건에 맞는 항목이 없어요.' : '등록된 단어가 없어요. 등록 탭에서 추가해 주세요.'));

}
function fillList(listEl, rows) {
  listEl.innerHTML = '';
  listEl.hidden = !rows.length;
  rows.slice(0, S.list.limit).forEach((i) => {
    const a = accOf(i);
    listEl.append(h('button', { class: 'li', onclick: () => openEdit(i) },
      h('span', { class: 'bar ' + i.kind }),
      h('span', { style: 'min-width:0' }, h('div', { class: 'tag sec-' + secOf(i) }, SEC[secOf(i)]), h('div', { class: 't' + (i.kind === 'example' ? ' ex' : '') }, i.term), h('div', { class: 'm' }, i.meaning)),
      h('span', { class: 'r', style: a != null ? `color:${a >= .8 ? 'var(--ok)' : a >= .5 ? 'var(--ex)' : 'var(--no)'}` : '' }, a != null ? pct(a) : '', h('small', null, i.attempts ? `${i.attempts}회` : '미학습'))));
  });
  if (rows.length > S.list.limit) listEl.append(h('button', { class: 'more', onclick: () => { S.list.limit += 200; refreshList(); } }, `더 보기 (${rows.length - S.list.limit}개 남음)`));
}
function refreshList() {
  const L = S.list, q = L.q.trim().toLowerCase();
  const rows = listRows();
  const box = document.getElementById('listBox'); if (box) fillList(box, rows);
}

/* ---------- 시트 ---------- */
function openSheet(content) {
  const close = () => { $layer.innerHTML = ''; };
  const bd = h('div', { class: 'backdrop', onclick: (e) => { if (e.target === bd) close(); } }, h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, h('div', { class: 'grab' }), content(close)));
  $layer.innerHTML = ''; $layer.append(bd);
}
function openEdit(item) {
  openSheet((close) => {
    const d = { term: item.term, meaning: item.meaning, kind: item.kind, section: secOf(item) };
    let confirmDel = false;
    const segBtns = [];
    const seg = h('div', { class: 'seg' }, ['word', 'example'].map((k) => { const b = h('button', { 'aria-pressed': String(d.kind === k), onclick: () => { d.kind = k; segBtns.forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.k === k))); } }, k === 'word' ? '단어' : '예문'); b.dataset.k = k; segBtns.push(b); return b; }));
    const secBtns = [];
    const secSeg = h('div', { class: 'seg' }, ['LC', 'RC'].map((k) => { const b = h('button', { 'aria-pressed': String(d.section === k), onclick: () => { d.section = k; secBtns.forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.k === k))); } }, SEC[k]); b.dataset.k = k; secBtns.push(b); return b; }));
    const t = h('textarea', { class: 'input en', id: 'editTerm', rows: 2, autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', oninput: (e) => (d.term = e.target.value) }); t.value = d.term;
    const m = h('textarea', { class: 'input', id: 'editMeaning', rows: 3, oninput: (e) => (d.meaning = e.target.value) }); m.value = d.meaning;
    const delBtn = h('button', { class: 'btn ghost', style: 'color:var(--no)', onclick: async () => {
      if (!confirmDel) { confirmDel = true; delBtn.textContent = '한 번 더 누르면 삭제'; delBtn.className = 'btn danger'; return; }
      S.items = S.items.filter((x) => x !== item); if (S.current === item) S.current = null;
      await Store.del([item.id]); close(); render(); toast('삭제했어요');
    } }, '삭제');
    return h('div', null,
      h('h2', null, '항목 편집', h('button', { class: 'iconbtn', html: I.x, 'aria-label': '닫기', onclick: close })),
      h('div', { class: 'form-l', style: 'margin-top:0' }, '단어장'), secSeg,
      h('div', { class: 'form-l' }, '구분'), seg,
      h('div', { class: 'form-l' }, '영어'), t,
      h('div', { class: 'form-l' }, '뜻'), m,
      h('div', { class: 'form-l' }, '학습 기록'),
      h('div', { class: 'kv' },
        h('div', null, h('b', null, item.attempts), h('span', null, '푼 횟수')),
        h('div', null, h('b', null, accOf(item) != null ? pct(accOf(item)) : '—'), h('span', null, '정답률')),
        h('div', null, h('b', null, item.weight >= 0.01 ? item.weight.toFixed(2) : item.weight.toExponential(0)), h('span', null, '출제 비중'))),
      h('div', { class: 'row-btns', style: 'margin-top:16px' },
        h('button', { class: 'btn primary', style: 'flex:1', onclick: async () => {
          if (!d.term.trim() || !d.meaning.trim()) { toast('영어와 뜻을 모두 입력해 주세요'); return; }
          Object.assign(item, { term: d.term.trim(), meaning: d.meaning.trim(), kind: d.kind, section: d.section });
          await Store.put(item); close(); render(); toast('저장했어요');
        } }, '저장'),
        h('button', { class: 'btn ghost', onclick: async () => { Object.assign(item, { weight: 1, attempts: 0, correct: 0, lastSeen: 0 }); await Store.put(item); close(); render(); toast('이 항목의 기록을 초기화했어요'); } }, '기록 초기화'),
        delBtn));
  });
}
function openMenu() {
  openSheet((close) => {
    let armReset = false, armDel = false;
    const resetBtn = h('button', { onclick: async () => {
      if (!armReset) { armReset = true; resetBtn.lastChild.firstChild.textContent = '한 번 더 누르면 초기화'; return; }
      S.items.forEach((i) => Object.assign(i, { weight: 1, attempts: 0, correct: 0, lastSeen: 0 }));
      await Store.putMany(S.items); close(); render(); toast('모든 학습 기록을 초기화했어요');
    } }, h('span', { html: I.reset }), h('span', null, '학습 기록 초기화', h('small', null, '단어는 그대로, 정답률과 출제 비중만 처음으로')));
    const delBtn = h('button', { class: 'warn', onclick: async () => {
      if (!armDel) { armDel = true; delBtn.lastChild.firstChild.textContent = `한 번 더 누르면 ${S.items.length}개 모두 삭제`; return; }
      const ids = S.items.map((i) => i.id); S.items = []; S.current = null;
      await Store.del(ids); close(); render(); toast('모두 삭제했어요');
    } }, h('span', { html: I.trash }), h('span', null, '전체 삭제', h('small', null, '되돌릴 수 없어요. 먼저 백업을 권해요')));
    const importInput = h('input', { type: 'file', accept: '.json,application/json,text/plain', hidden: true, onchange: (e) => { importBackup(e.target.files[0]); close(); } });
    return h('div', null,
      h('h2', null, '단어장 관리', h('button', { class: 'iconbtn', html: I.x, 'aria-label': '닫기', onclick: close })),
      h('div', { class: 'menu' },
        h('button', { onclick: () => { close(); S.auth = { ...S.auth, mode: 'admin', err: '' }; S.authOverlay = true; render(); } }, h('span', { html: I.spark }), h('span', null, '가입 승인 번호 만들기', h('small', null, '관리자 키가 필요해요'))),
        h('button', { onclick: () => { exportBackup(); } }, h('span', { html: I.down }), h('span', null, '백업 파일 내보내기', h('small', null, '단어와 학습 기록 전체를 파일 하나로 저장'))),
        h('button', { onclick: () => importInput.click() }, h('span', { html: I.up }), h('span', null, '백업 불러오기', h('small', null, '내보낸 파일을 선택하면 합쳐서 불러와요'))),
        resetBtn, delBtn,
        h('button', { onclick: () => { close(); logout(); } }, h('span', { html: I.up }), h('span', null, '로그아웃', h('small', null, `${S.user ? S.user.name + ' (' + S.user.id + ')' : ''} · 다시 들어올 때 비밀번호가 필요해요`)))),
      importInput,
      h('p', { class: 'note' }, `저장 위치: ${Store.mode === 'idb' ? '이 기기의 브라우저 저장소' : Store.mode === 'local' ? '이 기기의 브라우저 저장소(간이)' : '저장 안 됨 (화면을 닫으면 사라져요)'} · ${S.items.length}개`));
  });
}
function backupJSON() {
  return JSON.stringify({ app: 'toeic-voca', version: 1, exportedAt: new Date().toISOString(), items: S.items }, null, 1);
}
async function exportBackup() {
  if (!S.items.length) { toast('내보낼 단어가 없어요'); return; }
  const name = `토익단어-백업-${new Date().toISOString().slice(0, 10)}.json`;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: backupJSON() }); toast('백업 파일을 저장했어요'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  try {
    const file = new File([backupJSON()], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); toast('공유 시트에서 "파일에 저장"을 고르면 보관돼요'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); a.remove();
    toast('백업 파일을 만들었어요'); return;
  } catch (e) { if (e && e.name === 'AbortError') return; }
  // 대체: 텍스트로 복사
  openSheet((close) => {
    const ta = h('textarea', { class: 'input', rows: 8, readonly: true }); ta.value = backupJSON();
    return h('div', null, h('h2', null, '백업 복사하기', h('button', { class: 'iconbtn', html: I.x, 'aria-label': '닫기', onclick: close })),
      h('p', { class: 'note', style: 'margin:0 0 10px' }, '이 화면에서는 파일 저장이 안 돼요. 아래 내용을 복사해 메모 앱에 붙여 두면, 나중에 .json 파일로 저장해 불러올 수 있어요.'),
      ta, h('div', { class: 'row-btns' }, h('button', { class: 'btn primary', onclick: async () => { try { await navigator.clipboard.writeText(ta.value); toast('복사했어요'); } catch (e) { ta.select(); toast('길게 눌러 복사해 주세요'); } } }, '복사')));
  });
}
async function importBackup(file) {
  if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    const list = Array.isArray(obj) ? obj : obj.items;
    if (!Array.isArray(list)) throw new Error('형식');
    const byKey = new Map(S.items.map((i) => [keyOf(i.term, i.kind, i.section), i]));
    const changed = []; let added = 0, merged = 0;
    for (const r of list) {
      if (!r || !r.term || !r.meaning) continue;
      const kind = r.kind === 'example' ? 'example' : 'word';
      const section = r.section === 'LC' ? 'LC' : 'RC';
      const k = keyOf(r.term, kind, section), ex = byKey.get(k);
      if (ex) { if ((r.attempts || 0) > ex.attempts) { Object.assign(ex, { weight: +r.weight || 1, attempts: r.attempts | 0, correct: r.correct | 0, lastSeen: r.lastSeen || 0 }); changed.push(ex); merged++; } }
      else { const it = { ...newItem({ term: String(r.term), meaning: String(r.meaning), kind, section, ref: r.ref || '' }), weight: +r.weight || 1, attempts: r.attempts | 0, correct: r.correct | 0, createdAt: r.createdAt || Date.now(), lastSeen: r.lastSeen || 0 }; S.items.push(it); byKey.set(k, it); changed.push(it); added++; }
    }
    await Store.putMany(changed); render();
    toast(`${added}개 추가${merged ? `, ${merged}개 기록 갱신` : ''}`);
  } catch (e) { toast('백업 파일을 읽지 못했어요. 내보낸 .json 파일인지 확인해 주세요.'); }
}

/* ================= 라우팅 ================= */
function go(tab) { S.tab = tab; $layer.innerHTML = ''; render(true); $screen.scrollTop = 0; }
function render(animate) {
  const tabs = document.querySelector('.tabs');
  if (!S.user || S.authOverlay) {
    tabs.hidden = true;
    $screen.innerHTML = '';
    $screen.append(renderAuth());
    return;
  }
  tabs.hidden = false;
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === S.tab)));
  const keepScroll = $screen.querySelector('.scroll');
  const st = keepScroll && !animate ? keepScroll.scrollTop : 0;
  const active = document.activeElement && document.activeElement.id;
  $screen.innerHTML = '';
  const v = S.tab === 'study' ? renderStudy(animate) : S.tab === 'add' ? renderAdd() : renderList();
  [].concat(v).forEach((n) => n && $screen.append(n));
  const sc = $screen.querySelector('.scroll'); if (sc && st) sc.scrollTop = st;
  if (active) { const el = document.getElementById(active); if (el && el.tagName !== 'BUTTON') { el.focus({ preventScroll: true }); if (el.setSelectionRange && el.value) { try { const n = el.value.length; el.setSelectionRange(n, n); } catch (e) {} } } }
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => go(t.dataset.tab)));
document.addEventListener('keydown', (e) => {
  if (!S.user || S.authOverlay || S.tab !== 'study' || !S.current || $layer.firstChild || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'o' || e.key === 'ArrowLeft') answer(true);
  else if (e.key === 'x' || e.key === 'ArrowRight') answer(false);
  else if (e.key === ' ') { e.preventDefault(); S.revealed = !S.revealed; render(); }
});

if ('serviceWorker' in navigator) {
  // 새 버전이 설치되면 한 번 자동으로 새로고침 (GitHub에 파일을 바꿔 올리면 앱이 스스로 업데이트됨)
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then((r) => r.update()).catch(() => {}); });
}
(async function boot() {
  render();
  initClaude();
  await Store.init();
  try { S.users = await Store.users(); } catch (e) { S.users = []; }
  S.auth.admin.unlocked = !!(await Store.getMeta('admin'));
  let sid = await Store.getMeta('session');
  if (!sid) { try { sid = localStorage.getItem('toeic-voca-session'); } catch (e) {} }
  const me = S.users.find((u) => u.id === sid);
  if (me) { await enterApp(me); } else { render(); }      // 자동 로그인 / 첫 화면 로그인
  if (Store.mode === 'memory') showWarn('이 화면에서는 기기에 저장할 수 없어요. Safari에서 열어 주세요.');
  else if (Store.mode === 'local') showWarn('간이 저장소를 쓰고 있어요. 단어장 메뉴에서 백업을 가끔 내보내 주세요.');
  if (S.user) render(true);
})();
